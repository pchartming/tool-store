<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F6F8FC">
<title>工具市场 Tool Store · UI 原型</title>
<style>:root {
  --bg: #F6F8FC;
  --surface: #FFFFFF;
  --surface-2: #F1F5FA;
  --surface-3: #E9F0F8;
  --border: #E6EBF2;
  --border-strong: #D6DFEA;
  --text: #16212F;
  --text-2: #4C5C70;
  --muted: #8391A3;
  --accent: #2F7DFF;
  --accent-strong: #1B66E8;
  --accent-soft: #EAF2FF;
  --green: #129B67;
  --green-soft: #EAF9F2;
  --amber: #B9770E;
  --amber-soft: #FFF6E5;
  --red: #DE464D;
  --red-soft: #FDEEEF;
  --violet: #7350F2;
  --cyan: #0E93B5;
  --shadow-card: 0 4px 16px rgba(27, 54, 94, .055);
  --shadow-float: 0 18px 50px rgba(21, 44, 82, .14);
  --font: "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--text);
  font-family: var(--font);
  background: #EEF3FA;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-decoration: none; }
svg { display: block; flex: none; }
::selection { background: rgba(47, 125, 255, .18); }

button:focus-visible,
a:focus-visible,
input:focus-visible,
[role="button"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- desktop stage ---------- */
.stage {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 22px 20px;
  background:
    radial-gradient(760px 460px at 6% -8%, rgba(47, 125, 255, .11), transparent 64%),
    radial-gradient(620px 440px at 102% 108%, rgba(115, 80, 242, .08), transparent 64%),
    #EEF3FA;
}
.stage-caption {
  margin: 0;
  color: #7D8DA2;
  font-size: 10.5px;
  line-height: 1.7;
  text-align: center;
  letter-spacing: .02em;
}
.stage-caption strong { color: #4F637C; font-weight: 650; }

.phone {
  position: relative;
  width: 390px;
  height: 844px;
  max-height: calc(100dvh - 82px);
  overflow: hidden;
  border-radius: 44px;
  border: 1px solid rgba(25, 52, 90, .12);
  background: var(--bg);
  box-shadow:
    0 42px 100px rgba(28, 55, 96, .17),
    0 2px 6px rgba(28, 55, 96, .06),
    inset 0 0 0 1px rgba(255, 255, 255, .9);
  isolation: isolate;
}

/* ---------- status bar / shell ---------- */
.statusbar {
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
  padding: 0 24px;
  color: #33475E;
  background: var(--bg);
}
.sb-time { font-size: 11px; font-weight: 650; letter-spacing: .03em; }
.status-icons { display: flex; align-items: center; gap: 5px; color: #33475E; }

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg);
}
.statusbar + .app { height: calc(100% - 32px); }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
  padding: 6px 18px 4px;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  flex: none;
  color: #fff;
  background: linear-gradient(145deg, #5A9BFF 0%, #2F7DFF 58%, #2469E8 100%);
  box-shadow: 0 7px 18px rgba(47, 125, 255, .25), inset 0 1px 0 rgba(255, 255, 255, .3);
}
.brand-copy { min-width: 0; }
.brand-copy h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1.2;
}
.brand-copy p {
  margin: 3px 0 0;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .02em;
  white-space: nowrap;
}
.icon-btn {
  width: 38px;
  height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(27, 54, 94, .04);
  transition: background .16s ease, color .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.icon-btn:hover { color: var(--accent); border-color: rgba(47, 125, 255, .26); box-shadow: 0 5px 14px rgba(47, 125, 255, .1); }
.icon-btn:active { transform: scale(.97); }

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px 16px 28px;
  scrollbar-width: none;
}
.content::-webkit-scrollbar { display: none; }

/* ---------- search / filter ---------- */
.search-row { display: flex; align-items: center; gap: 8px; }
.search-box {
  flex: 1;
  min-width: 0;
  height: 43px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  box-shadow: 0 3px 10px rgba(27, 54, 94, .035);
  transition: border-color .16s ease, box-shadow .16s ease;
}
.search-box:focus-within {
  border-color: rgba(47, 125, 255, .42);
  box-shadow: 0 0 0 3px rgba(47, 125, 255, .07);
}
.search-input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  padding: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 12.5px;
}
.search-input::placeholder { color: #9AA7B7; }
.search-clear {
  width: 22px;
  height: 22px;
  flex: none;
  display: none;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--surface-3);
  color: var(--muted);
  cursor: pointer;
}
.search-clear.show { display: grid; }
.search-clear:hover { color: var(--text-2); background: #E1E9F3; }

.filter-row {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  padding: 1px 1px 3px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  height: 30px;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.filter-chip:hover { border-color: #CFDCEB; color: var(--text); }
.filter-chip .chip-count { color: var(--muted); font-size: 9px; font-weight: 600; }
.filter-chip.active {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 4px 12px rgba(47, 125, 255, .22);
}
.filter-chip.active .chip-count { color: rgba(255, 255, 255, .72); }

/* ---------- device card ---------- */
.device-card {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 17px;
  border: 1px solid #D9E8FF;
  background: linear-gradient(135deg, #EDF5FF 0%, #F8FBFF 72%, #FFFFFF 100%);
  color: inherit;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(47, 125, 255, .045);
  transition: border-color .16s ease, box-shadow .16s ease;
}
.device-card::after {
  content: "";
  position: absolute;
  right: -24px;
  top: -38px;
  width: 112px;
  height: 112px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(47, 125, 255, .09), transparent 68%);
  pointer-events: none;
}
.device-card:hover { border-color: #C5DBFF; box-shadow: 0 7px 20px rgba(47, 125, 255, .09); }
.device-card.offline {
  border-color: #F0DFC0;
  background: linear-gradient(135deg, #FFF9EF 0%, #FFFDF8 100%);
}
.device-card.offline::after { background: radial-gradient(circle, rgba(185, 119, 14, .08), transparent 68%); }
.device-icon {
  width: 36px;
  height: 36px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--accent);
  background: #fff;
  border: 1px solid rgba(47, 125, 255, .15);
  box-shadow: 0 2px 7px rgba(47, 125, 255, .08);
  position: relative;
  z-index: 1;
}
.device-card.offline .device-icon { color: #B9770E; border-color: #F0DFC0; box-shadow: none; }
.device-copy { display: block; flex: 1; min-width: 0; position: relative; z-index: 1; }
.device-status {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--green);
  font-size: 9.8px;
  font-weight: 600;
  letter-spacing: .02em;
}
.device-card.offline .device-status { color: #A0721A; }
.dot {
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(18, 155, 103, .1);
}
.device-card.offline .dot { background: #D29A39; box-shadow: 0 0 0 3px rgba(185, 119, 14, .09); }
.device-name {
  display: block;
  margin-top: 2px;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: .002em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.device-meta {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 9.8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.device-chevron { color: #8A99AB; margin-left: 2px; flex: none; position: relative; z-index: 1; }
.device-cta {
  flex: none;
  margin-left: 2px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  padding: 0 11px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 650;
  color: #fff;
  background: var(--accent);
  box-shadow: 0 4px 10px rgba(47, 125, 255, .2);
  position: relative;
  z-index: 1;
}

/* ---------- store sections ---------- */
.store-section { margin-top: 20px; }
.store-section:first-of-type { margin-top: 18px; }
.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin: 0 2px 10px;
}
.section-copy { min-width: 0; }
.section-copy h2 {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 16px;
  font-weight: 680;
  letter-spacing: -.005em;
}
.section-copy p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 9.8px;
  letter-spacing: .01em;
}
.section-count {
  flex: none;
  padding-bottom: 1px;
  color: var(--muted);
  font-size: 9.5px;
  font-variant-numeric: tabular-nums;
}

.tool-list { display: flex; flex-direction: column; gap: 10px; }
.tool-card {
  position: relative;
  padding: 14px;
  overflow: hidden;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-card);
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
.tool-card:hover {
  border-color: #C9DCFF;
  box-shadow: 0 10px 26px rgba(47, 125, 255, .1);
  transform: translateY(-1px);
}
.tool-card.is-new {
  border-color: rgba(224, 90, 43, .17);
  background: linear-gradient(140deg, #FFFFFF 38%, #FFF8F4 100%);
}
.tool-card.is-new:hover { border-color: rgba(224, 90, 43, .28); box-shadow: 0 10px 26px rgba(224, 90, 43, .09); }
.card-open {
  position: absolute;
  inset: 0;
  z-index: 1;
  padding: 0;
  border: 0;
  border-radius: inherit;
  background: transparent;
  cursor: pointer;
}
.card-open:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.tool-top,
.tool-desc,
.tool-features,
.card-note {
  position: relative;
  z-index: 2;
  pointer-events: none;
}
.tool-top { display: flex; align-items: flex-start; gap: 11px; }
.app-logo {
  width: 46px;
  height: 46px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: var(--logo-color, var(--accent));
  background: linear-gradient(150deg, var(--logo-tint, rgba(47, 125, 255, .12)), #FFFFFF 88%);
  border: 1px solid var(--logo-border, rgba(47, 125, 255, .22));
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -.02em;
  box-shadow: inset 0 1px 0 #fff, 0 3px 9px rgba(27, 54, 94, .055);
}
.tool-copy { flex: 1; min-width: 0; padding-top: 1px; }
.tool-name-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  min-width: 0;
}
.tool-name-row h3 {
  margin: 0;
  max-width: 100%;
  font-size: 15px;
  font-weight: 680;
  letter-spacing: -.005em;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tool-tagline {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 5px;
  border: 1px solid transparent;
  font-size: 9px;
  line-height: 1;
  font-weight: 650;
  letter-spacing: .015em;
  white-space: nowrap;
}
.badge-green { color: #0C8257; background: var(--green-soft); border-color: #CCEFDF; }
.badge-amber { color: #95620B; background: var(--amber-soft); border-color: #F2DBAE; }
.badge-blue { color: #1F64D6; background: var(--accent-soft); border-color: #D4E5FF; }
.badge-orange { color: #C14D1F; background: #FFF0EA; border-color: #FFD9CB; }
.badge-muted { color: var(--text-2); background: var(--surface-2); border-color: var(--border); }

.store-btn {
  position: relative;
  z-index: 3;
  flex: none;
  min-width: 56px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 13px;
  margin-top: 1px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: .01em;
  white-space: nowrap;
  cursor: pointer;
  pointer-events: auto;
  transition: filter .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.store-btn.primary {
  color: #fff;
  background: var(--accent);
  box-shadow: 0 4px 12px rgba(47, 125, 255, .22);
}
.store-btn.primary:hover { filter: brightness(1.04); box-shadow: 0 6px 15px rgba(47, 125, 255, .27); }
.store-btn.ghost {
  color: var(--accent);
  background: #fff;
  border-color: #D4E3FA;
}
.store-btn.ghost:hover { background: #F5F9FF; border-color: #BFD6FA; }
.store-btn.amber {
  color: #96620C;
  background: var(--amber-soft);
  border-color: #F0D7A6;
}
.store-btn.amber:hover { background: #FFF1D7; }
.store-btn:disabled { opacity: .5; cursor: not-allowed; }

.tool-desc {
  margin: 9px 0 0;
  color: var(--text-2);
  font-size: 11px;
  line-height: 1.55;
}
.tool-features {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}
.feature-chip {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid var(--chip-border, rgba(47, 125, 255, .15));
  background: var(--chip-bg, var(--accent-soft));
  color: var(--chip-color, var(--accent));
  font-size: 9.2px;
  font-weight: 600;
  letter-spacing: .005em;
  white-space: nowrap;
}
.feature-chip.warn { color: #95620B; background: var(--amber-soft); border-color: #F1D9A9; }
.feature-chip.dot::before {
  content: "";
  width: 4px;
  height: 4px;
  margin-right: 4px;
  border-radius: 50%;
  background: currentColor;
  opacity: .72;
}
.card-note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed #ECF0F5;
  color: #8B6A25;
  font-size: 9.5px;
  line-height: 1.5;
}
.card-note svg { margin-top: 1px; }
.card-note.info { color: #63758A; }
.card-note.info svg { color: var(--accent); }

.empty-state {
  margin-top: 20px;
  padding: 30px 20px;
  border-radius: 20px;
  border: 1px dashed var(--border-strong);
  background: rgba(255, 255, 255, .6);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  text-align: center;
}
.empty-state strong { display: block; margin-bottom: 4px; color: var(--text-2); font-size: 12.5px; }
.empty-state button { margin-top: 10px; }

/* ---------- trust / curation ---------- */
.safety-card {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
  padding: 11px 12px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-card);
}
.safety-icon {
  width: 33px;
  height: 33px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--green);
  background: var(--green-soft);
}
.safety-copy { min-width: 0; }
.safety-copy strong {
  display: block;
  color: var(--text-2);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: .01em;
}
.safety-copy span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 9.3px;
  line-height: 1.5;
}
.curation-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid #DEEAFF;
  background: linear-gradient(135deg, #F0F6FF 0%, #F9FBFF 100%);
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.curation-card:hover { border-color: #C9DDFF; box-shadow: 0 6px 18px rgba(47, 125, 255, .07); }
.curation-icon {
  width: 33px;
  height: 33px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--accent);
  background: #fff;
  border: 1px solid #D8E7FF;
}
.curation-copy { flex: 1; min-width: 0; }
.curation-copy strong { display: block; color: var(--text-2); font-size: 10.8px; font-weight: 650; }
.curation-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 9.3px; }
.curation-cta { flex: none; color: var(--accent); font-size: 9.8px; font-weight: 650; }

.hint {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  margin: 14px 4px 0;
  color: var(--muted);
  font-size: 9.8px;
  line-height: 1.6;
}
.hint svg { margin-top: 1px; color: #9AA8B8; }/* ---------- overlay / bottom sheet ---------- */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 40;
  background: rgba(16, 32, 55, .32);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  max-height: 92%;
  border-radius: 28px 28px 0 0;
  border-top: 1px solid rgba(23, 50, 88, .08);
  background: var(--surface);
  box-shadow: 0 -18px 60px rgba(21, 44, 82, .16);
  transform: translateY(102%);
  transition: transform .27s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 38px;
  height: 4px;
  flex: none;
  margin: 9px auto 0;
  border-radius: 999px;
  background: #D7E0EB;
}
.sheet-body {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 16px 20px calc(26px + env(safe-area-inset-bottom));
  scrollbar-width: none;
}
.sheet-body::-webkit-scrollbar { display: none; }

.sheet-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
}
.sheet-eyebrow {
  display: block;
  color: var(--accent);
  font-size: 9.5px;
  font-weight: 680;
  letter-spacing: .1em;
}
.sheet-title {
  margin: 0;
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1.25;
}
.sheet-sub {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.55;
}
.sheet-close {
  width: 32px;
  height: 32px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.sheet-close:hover { background: var(--surface-3); color: var(--text); }
.sheet-close:active { transform: scale(.95); }

/* ---------- generic controls ---------- */
.btn {
  height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 17px;
  border: 1px solid transparent;
  border-radius: 14px;
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: .005em;
  text-align: center;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, filter .15s ease, transform .1s ease, opacity .15s ease, box-shadow .15s ease;
}
.btn:active { transform: scale(.995); }
.btn:disabled { opacity: .42; cursor: not-allowed; transform: none; }
.btn-primary {
  color: #fff;
  background: var(--accent);
  box-shadow: 0 7px 18px rgba(47, 125, 255, .2);
}
.btn-primary:hover { background: var(--accent-strong); box-shadow: 0 9px 22px rgba(47, 125, 255, .24); }
.btn-ghost {
  color: var(--text-2);
  background: #fff;
  border-color: var(--border-strong);
}
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-danger {
  color: var(--red);
  background: var(--red-soft);
  border-color: #F4CDCF;
}
.btn-danger:hover { background: #FCE4E6; }
.btn-block { width: 100%; }
.btn-sm { height: 32px; padding: 0 13px; border-radius: 10px; font-size: 11px; }
.btn .spinner { border-color: rgba(255, 255, 255, .3); border-top-color: #fff; }
.btn-ghost .spinner { border-color: rgba(47, 125, 255, .18); border-top-color: var(--accent); }

.btn-text {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px 2px;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 10.8px;
  font-weight: 650;
  letter-spacing: .005em;
  cursor: pointer;
}
.btn-text:hover { color: var(--accent-strong); }

.divider { height: 1px; margin: 18px 0; background: var(--border); }

/* ---------- detail ---------- */
.detail-head {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 2px 0 6px;
}
.detail-logo {
  width: 58px;
  height: 58px;
  border-radius: 18px;
  font-size: 23px;
}
.detail-head-copy { flex: 1; min-width: 0; padding-right: 31px; }
.detail-name {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.015em;
  line-height: 1.2;
}
.detail-latin {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: .05em;
}
.detail-tagline {
  margin: 3px 0 0;
  color: var(--text-2);
  font-size: 10.8px;
  line-height: 1.45;
}
.detail-status { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.detail-head .sheet-close { position: absolute; top: 0; right: 0; }
.detail-features { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.detail-desc {
  margin: 12px 1px 0;
  color: var(--text-2);
  font-size: 10.5px;
  line-height: 1.65;
}

.form-label {
  margin: 19px 2px 8px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 680;
  letter-spacing: .06em;
}
.form-label:first-child { margin-top: 4px; }
.field-hint {
  margin: 8px 2px 0;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.55;
}
.fineprint {
  margin: 12px 2px 0;
  color: var(--muted);
  font-size: 9.3px;
  line-height: 1.6;
  text-align: center;
}

.segmented {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface-2);
}
.segmented button {
  flex: 1;
  height: 35px;
  min-width: 0;
  padding: 0 6px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
}
.segmented button:hover { color: var(--text-2); }
.segmented button.active {
  color: var(--text);
  background: #fff;
  box-shadow: 0 2px 8px rgba(27, 54, 94, .09);
}

.info-list {
  overflow: hidden;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.info-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 10px 13px;
  font-size: 11px;
  line-height: 1.45;
}
.info-row + .info-row { border-top: 1px solid var(--border); }
.info-key { flex: none; color: var(--muted); }
.info-val { min-width: 0; color: var(--text-2); text-align: right; overflow-wrap: anywhere; }
.info-val.mono { font-family: var(--mono); font-size: 10px; letter-spacing: -.01em; }
.info-val.ok { color: var(--green); font-weight: 600; }
.info-val.warn { color: var(--amber); font-weight: 600; }

.option-list {
  overflow: hidden;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.option-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 13px;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.option-row + .option-row { border-top: 1px solid var(--border); }
.option-row.static { cursor: default; }
.option-copy { flex: 1; min-width: 0; }
.option-title { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.option-desc { display: block; margin-top: 3px; color: var(--muted); font-size: 9.5px; line-height: 1.45; }
.option-pill {
  flex: none;
  color: #0C8257;
  font-size: 9px;
  font-weight: 650;
  padding: 3px 6px;
  border-radius: 5px;
  background: var(--green-soft);
  border: 1px solid #CCEFDF;
}

.switch {
  position: relative;
  width: 42px;
  height: 25px;
  flex: none;
  border-radius: 999px;
  background: #DCE5EF;
  border: 1px solid transparent;
  transition: background .18s ease, border-color .18s ease;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(24, 45, 76, .24);
  transition: transform .18s ease;
}
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(17px); }
.switch.locked { opacity: .72; }

.notice {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-top: 12px;
  padding: 11px 12px;
  border-radius: 13px;
  border: 1px solid #F2DBAE;
  background: var(--amber-soft);
  color: #B9770E;
}
.notice svg { margin-top: 1px; }
.notice div { min-width: 0; }
.notice strong { display: block; color: #73510D; font-size: 10.5px; font-weight: 650; line-height: 1.4; }
.notice p { margin: 3px 0 0; color: #8A6B2D; font-size: 9.5px; line-height: 1.55; }
.notice.blue { border-color: #D5E5FF; background: #F1F7FF; color: var(--accent); }
.notice.blue strong { color: #1D5BBE; }
.notice.blue p { color: #607790; }
.notice.green { border-color: #CBEDDE; background: #EFFBF5; color: var(--green); }
.notice.green strong { color: #0C6B4A; }
.notice.green p { color: #587B6C; }
.notice.red { border-color: #F4CDCF; background: var(--red-soft); color: var(--red); }
.notice.red strong { color: #A93137; }
.notice.red p { color: #8C5B5E; }

.action-row { display: flex; gap: 8px; margin: 14px 0 12px; }
.action-row .btn { flex: 1; min-width: 0; padding: 0 10px; }
.detail-section { margin-top: 18px; }
.detail-section + .detail-section { margin-top: 16px; }

.number-list { display: flex; flex-direction: column; gap: 11px; margin: 12px 0; }
.number-item { display: flex; gap: 10px; }
.number-badge {
  width: 22px;
  height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid #D5E5FF;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
}
.number-copy { color: var(--muted); font-size: 10.5px; line-height: 1.55; }
.number-copy strong { color: var(--text-2); font-weight: 650; }

.check-list { display: flex; flex-direction: column; gap: 7px; margin: 11px 0 2px; }
.check-item { display: flex; gap: 7px; color: var(--text-2); font-size: 9.8px; line-height: 1.5; }
.check-item svg { margin-top: 1px; color: var(--green); }

.prompt-box {
  overflow: hidden;
  margin-top: 11px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #F8FAFD;
}
.prompt-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 11px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 9.5px;
}
.prompt-body {
  max-height: 82px;
  overflow: hidden;
  padding: 10px 12px;
  color: #5E7188;
  font: 9.3px/1.65 var(--mono);
  white-space: pre-wrap;
  word-break: break-word;
  position: relative;
}
.prompt-body::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 26px;
  background: linear-gradient(transparent, #F8FAFD);
  pointer-events: none;
}
.code-box {
  margin-top: 10px;
  overflow: hidden;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: #F8FAFD;
}
.code-head {
  padding: 7px 11px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 9.5px;
}
.code-body {
  margin: 0;
  padding: 9px 11px;
  color: #40536B;
  font: 9.3px/1.65 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* ---------- progress / steps ---------- */
.progress-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.progress-app { display: flex; align-items: center; gap: 11px; min-width: 0; }
.progress-app .app-logo { width: 43px; height: 43px; border-radius: 14px; font-size: 17px; }
.progress-kicker { color: var(--accent); font-size: 9.2px; font-weight: 650; letter-spacing: .06em; }
.progress-title {
  margin-top: 2px;
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.progress-note {
  margin: 12px 1px 15px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.steps { display: flex; flex-direction: column; }
.step { display: flex; gap: 11px; padding-bottom: 13px; }
.step:last-child { padding-bottom: 0; }
.step-rail { width: 20px; flex: none; display: flex; flex-direction: column; align-items: center; }
.step-dot {
  width: 20px;
  height: 20px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--muted);
  font-size: 9px;
  font-weight: 650;
  z-index: 1;
}
.step-line { width: 1px; flex: 1; min-height: 8px; margin-top: 3px; background: #E3EAF2; }
.step:last-child .step-line { display: none; }
.step-copy { flex: 1; min-width: 0; padding-top: 1px; }
.step-title { color: var(--text-2); font-size: 11.5px; font-weight: 550; line-height: 1.35; }
.step-detail { margin-top: 3px; color: var(--muted); font-size: 9.5px; line-height: 1.5; overflow-wrap: anywhere; }
.step.done .step-dot { color: #fff; border-color: var(--green); background: var(--green); }
.step.done .step-title { color: var(--muted); }
.step.done .step-line { background: #CBEADC; }
.step.active .step-dot { color: var(--accent); border-color: #A9CBFF; background: var(--accent-soft); box-shadow: 0 0 0 4px rgba(47, 125, 255, .07); }
.step.active .step-title { color: var(--text); font-weight: 650; }
.step.skipped .step-dot { color: var(--muted); background: var(--surface-2); }
.step.skipped .step-title { color: var(--muted); }
.step.fail .step-dot { color: var(--red); border-color: #F1BEC1; background: var(--red-soft); }
.step.fail .step-title { color: var(--red); }

.step-progress { display: none; margin-top: 7px; }
.progress-track { height: 5px; overflow: hidden; border-radius: 999px; background: #E9EFF7; }
.progress-bar {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #4B8FFF, #2F7DFF);
  transition: width .08s linear;
}
.progress-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 5px;
  color: var(--muted);
  font-size: 8.5px;
  font-variant-numeric: tabular-nums;
}
.spinner {
  width: 11px;
  height: 11px;
  display: inline-block;
  border-radius: 50%;
  border: 1.7px solid rgba(47, 125, 255, .2);
  border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
.step-dot .spinner { width: 10px; height: 10px; border-width: 1.5px; }

.log-details {
  margin-top: 15px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #FAFBFD;
  padding: 0 12px;
}
.log-details summary {
  padding: 10px 0;
  color: var(--muted);
  font-size: 9.5px;
  cursor: pointer;
  list-style: none;
}
.log-details summary::-webkit-details-marker { display: none; }
.log-details summary::before { content: "› "; color: var(--text-2); }
.log-details[open] summary::before { content: "⌄ "; }
.log-details pre {
  margin: 0 0 10px;
  max-height: 100px;
  overflow: auto;
  color: #6F8094;
  font: 8.5px/1.65 var(--mono);
  white-space: pre-wrap;
}

/* ---------- result ---------- */
.result-hero { padding: 9px 6px 17px; text-align: center; }
.result-icon {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  margin: 0 auto 13px;
  border-radius: 50%;
}
.result-icon.success { color: var(--green); background: var(--green-soft); border: 1px solid #C4EADB; box-shadow: 0 0 0 8px rgba(18, 155, 103, .035); }
.result-icon.warn { color: var(--amber); background: var(--amber-soft); border: 1px solid #F0D7A6; box-shadow: 0 0 0 8px rgba(185, 119, 14, .03); }
.result-icon.fail { color: var(--red); background: var(--red-soft); border: 1px solid #F2C9CC; box-shadow: 0 0 0 8px rgba(222, 70, 77, .03); }
.result-title { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.result-desc { max-width: 292px; margin: 7px auto 0; color: var(--muted); font-size: 10.5px; line-height: 1.65; }

/* ---------- modal ---------- */
.modal-wrap {
  position: absolute;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(16, 32, 55, .32);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease;
}
.modal-wrap.show { opacity: 1; pointer-events: auto; }
.modal-backdrop { position: absolute; inset: 0; }
.modal {
  position: relative;
  width: 100%;
  max-width: 330px;
  max-height: 88%;
  overflow-y: auto;
  padding: 20px;
  border-radius: 23px;
  border: 1px solid rgba(255, 255, 255, .9);
  background: #fff;
  box-shadow: 0 28px 70px rgba(21, 44, 82, .22);
  transform: scale(.97);
  transition: transform .18s ease;
  scrollbar-width: none;
}
.modal::-webkit-scrollbar { display: none; }
.modal-wrap.show .modal { transform: scale(1); }
.modal-title { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.3; }
.modal-sub { margin: 6px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; overflow-wrap: anywhere; }
.modal .info-list { margin-top: 13px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn { flex: 1; height: 43px; }
.warn-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 13px 0;
  padding: 11px 12px;
  border-radius: 13px;
  border: 1px solid #F2DBAE;
  background: var(--amber-soft);
}
.warn-item { display: flex; gap: 7px; color: #86682D; font-size: 9.5px; line-height: 1.55; }
.warn-item svg { margin-top: 1px; color: #B9770E; }
.check-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin: 12px 0 2px;
  padding: 11px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #FBFCFE;
  color: var(--text-2);
  font-size: 10px;
  line-height: 1.5;
  cursor: pointer;
}
.check-row input {
  width: 15px;
  height: 15px;
  flex: none;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

/* ---------- toast ---------- */
.toast {
  position: absolute;
  left: 50%;
  bottom: 30px;
  z-index: 100;
  max-width: calc(100% - 44px);
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, .08);
  background: rgba(27, 43, 64, .95);
  color: #fff;
  box-shadow: 0 14px 34px rgba(21, 44, 82, .2);
  font-size: 10.5px;
  line-height: 1.45;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity .22s ease, transform .22s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes spin { to { transform: rotate(360deg); } }/* ---------- device sheet ---------- */
.device-hero {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border-radius: 17px;
  border: 1px solid #DCEAFF;
  background: linear-gradient(135deg, #F0F7FF 0%, #FAFCFF 100%);
}
.device-hero-icon {
  width: 44px;
  height: 44px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 14px;
  color: var(--accent);
  background: #fff;
  border: 1px solid #D8E8FF;
  box-shadow: 0 3px 9px rgba(47, 125, 255, .07);
}
.device-hero-copy { flex: 1; min-width: 0; }
.device-hero-name { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.device-hero-meta { margin-top: 4px; color: var(--muted); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.installed-list {
  overflow: hidden;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.installed-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.installed-row + .installed-row { border-top: 1px solid var(--border); }
.installed-row.static { cursor: default; }
.installed-row:not(.static):hover { background: #F4F8FE; }
.installed-logo { width: 32px; height: 32px; border-radius: 10px; font-size: 13px; }
.installed-copy { display: block; flex: 1; min-width: 0; }
.installed-name { display: block; font-size: 11px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.installed-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.installed-tail { flex: none; color: var(--muted); font-size: 9px; }
.installed-tail.locked { display: flex; align-items: center; gap: 4px; }

.action-list { display: flex; flex-direction: column; gap: 7px; }
.action-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-2);
  text-align: left;
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 2px 7px rgba(27, 54, 94, .025);
  transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.action-item:hover { background: #F9FBFF; border-color: #CADCF7; box-shadow: 0 4px 12px rgba(47, 125, 255, .05); }
.action-item:disabled { opacity: .42; cursor: not-allowed; }
.action-item svg { color: var(--muted); }
.action-copy { flex: 1; min-width: 0; }
.action-title { display: block; font-size: 11px; font-weight: 600; }
.action-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; line-height: 1.4; }
.action-arrow { color: #9AA8B8; }
.action-item.danger { color: var(--red); border-color: #F4D6D8; background: #FFFAFA; }
.action-item.danger svg { color: var(--red); }
.action-item.danger .action-sub { color: #A67A7D; }

/* ---------- connect ---------- */
.scan-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.scan-radar {
  position: relative;
  width: 38px;
  height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid #D5E5FF;
}
.scan-radar::before,
.scan-radar::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  border: 1px solid rgba(47, 125, 255, .22);
  animation: radar 2.5s ease-out infinite;
}
.scan-radar::after { animation-delay: 1.25s; }
@keyframes radar {
  0% { transform: scale(.9); opacity: .7; }
  80%, 100% { transform: scale(1.55); opacity: 0; }
}
.scan-copy { flex: 1; min-width: 0; }
.scan-title { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
.scan-meta { margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.45; }
.candidate {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 9px;
  padding: 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.candidate-icon {
  width: 35px;
  height: 35px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid #D5E5FF;
}
.candidate-copy { flex: 1; min-width: 0; }
.candidate-name { font-size: 10.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.candidate-meta { margin-top: 3px; color: var(--muted); font-size: 8.8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.connect-fields { display: flex; gap: 8px; margin-top: 11px; }
.field { flex: 1; min-width: 0; }
.field.port { flex: 0 0 88px; }
.field-label { display: block; margin: 0 2px 5px; color: var(--muted); font-size: 9px; }
.text-input {
  width: 100%;
  height: 41px;
  padding: 0 11px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #F8FAFD;
  color: var(--text);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.text-input::placeholder { color: #A3AEBC; }
.text-input:focus { border-color: rgba(47, 125, 255, .45); background: #fff; box-shadow: 0 0 0 3px rgba(47, 125, 255, .07); }
.connect-note { margin: 10px 2px 0; color: var(--muted); font-size: 9px; line-height: 1.6; }

/* ---------- settings ---------- */
.settings-group { margin-top: 17px; }
.settings-group:first-of-type { margin-top: 3px; }
.group-title {
  margin: 0 2px 7px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 680;
  letter-spacing: .06em;
}
.radio-group {
  overflow: hidden;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.radio-row {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.radio-row + .radio-row { border-top: 1px solid var(--border); }
.radio-row:hover { background: #F5F9FF; }
.radio-dot {
  width: 16px;
  height: 16px;
  flex: none;
  display: grid;
  place-items: center;
  margin-top: 1px;
  border-radius: 50%;
  border: 1px solid #C5D1DF;
  background: #fff;
}
.radio-dot.active { border-color: var(--accent); }
.radio-dot.active::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.radio-copy { flex: 1; min-width: 0; }
.radio-label { display: block; color: var(--text-2); font-size: 10.5px; font-weight: 600; }
.radio-desc { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; line-height: 1.45; }

.switch-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.switch-row + .switch-row { border-top: 1px solid var(--border); }
.switch-row.static { cursor: default; }
.switch-row:not(.static):hover { background: #F5F9FF; }
.switch-copy { flex: 1; min-width: 0; }
.switch-title { display: block; color: var(--text-2); font-size: 10.5px; font-weight: 600; }
.switch-desc { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; line-height: 1.45; }

.proxy-fields { display: flex; gap: 8px; margin: 9px 12px 11px; }
.proxy-fields .field-label { font-size: 8.5px; }
.settings-note {
  margin: 9px 2px 0;
  padding-left: 8px;
  border-left: 2px solid #D7E4F5;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.6;
}
.about-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 11px 12px;
  border: 0;
  background: transparent;
  color: var(--text-2);
  text-align: left;
  font: inherit;
  font-size: 10.5px;
}
.about-row + .about-row { border-top: 1px solid var(--border); }
.about-row.actionable { cursor: pointer; }
.about-row.actionable:hover { background: #F5F9FF; }
.about-val { flex: none; color: var(--muted); font-size: 9.5px; }
.about-row.actionable .about-val { color: var(--accent); display: flex; align-items: center; gap: 4px; }
.settings-footer { margin: 16px 4px 0; color: var(--muted); font-size: 8.8px; line-height: 1.65; text-align: center; }
.reset-link { display: block; margin: 9px auto 0; }

/* ---------- projects ---------- */
.project-list {
  overflow: hidden;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.project-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  color: inherit;
}
.project-row + .project-row { border-top: 1px solid var(--border); }
.project-row:hover { background: #F5F9FF; }
.project-logo { width: 32px; height: 32px; border-radius: 10px; font-size: 13px; }
.project-copy { flex: 1; min-width: 0; }
.project-name { display: block; color: var(--text-2); font-size: 10.5px; font-weight: 600; }
.project-meta { display: block; margin-top: 2px; color: var(--muted); font-family: var(--mono); font-size: 8.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-row > svg { color: var(--muted); }

/* ---------- help ---------- */
.help-block { margin-top: 16px; }
.help-block h3 {
  margin: 0 0 6px;
  color: var(--text-2);
  font-size: 11.5px;
  font-weight: 650;
}
.help-block p {
  margin: 0;
  color: var(--muted);
  font-size: 9.8px;
  line-height: 1.65;
}
.help-block p + p { margin-top: 6px; }

.empty-note {
  padding: 14px;
  border-radius: 14px;
  border: 1px dashed var(--border-strong);
  background: #FBFCFE;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.6;
  text-align: center;
}

.prompt-head .btn-sm { height: 23px; padding: 0 8px; font-size: 8.5px; border-radius: 7px; }

/* ---------- topic / curation / tool permissions ---------- */
.topic-hero {
  position: relative;
  overflow: hidden;
  padding: 15px;
  border-radius: 18px;
  border: 1px solid #D8E7FF;
  background: linear-gradient(135deg, #EEF6FF 0%, #F5F1FF 100%);
}
.topic-hero::after {
  content: "";
  position: absolute;
  right: -34px;
  top: -54px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(115, 80, 242, .1), transparent 68%);
  pointer-events: none;
}
.topic-kicker { color: var(--accent); font-size: 9px; font-weight: 680; letter-spacing: .08em; }
.topic-title { margin: 5px 0 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.topic-desc { max-width: 285px; margin: 6px 0 0; color: var(--text-2); font-size: 10px; line-height: 1.6; }
.topic-icons { display: flex; gap: 7px; margin-top: 11px; }
.topic-icons .app-logo { width: 34px; height: 34px; border-radius: 11px; font-size: 14px; }

.topic-apps { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.topic-app {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: #FBFCFE;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.topic-app:hover { border-color: #C9DDFF; background: #F7FAFF; }
.topic-app:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.topic-app-copy { flex: 1; min-width: 0; }
.topic-app-name { display: flex; align-items: center; gap: 5px; color: var(--text-2); font-size: 11px; font-weight: 650; }
.topic-app-meta { margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.45; }
.topic-app .app-logo { width: 38px; height: 38px; border-radius: 12px; font-size: 15px; }

.curation-list { display: flex; flex-direction: column; gap: 8px; margin: 13px 0; }
.curation-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 11px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #FBFCFE;
  color: var(--text-2);
  font-size: 9.8px;
  line-height: 1.5;
}
.curation-item svg { margin-top: 1px; color: var(--green); }
.curation-template {
  margin-top: 12px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: #F8FAFD;
  overflow: hidden;
}
.curation-template-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 11px;
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 9.5px;
}
.curation-template pre {
  margin: 0;
  padding: 10px 12px;
  color: #5E7188;
  font: 9.3px/1.7 var(--mono);
  white-space: pre-wrap;
}

.permission-list { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.permission-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #FBFCFE;
}
.permission-num {
  width: 23px;
  height: 23px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
  border: 1px solid #D5E5FF;
}
.permission-copy { flex: 1; min-width: 0; }
.permission-title { display: block; color: var(--text-2); font-size: 10.8px; font-weight: 650; }
.permission-title em {
  margin-left: 5px;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--amber-soft);
  color: var(--amber);
  font-style: normal;
  font-size: 8.5px;
  font-weight: 650;
}
.permission-desc { display: block; margin-top: 3px; color: var(--muted); font-size: 9.3px; line-height: 1.5; }
.permission-item.optional .permission-num { color: var(--amber); background: var(--amber-soft); border-color: #F0D7A6; }

.topic-footnote {
  margin: 12px 2px 0;
  padding: 10px 11px;
  border-radius: 12px;
  background: #F7F9FC;
  color: var(--muted);
  font-size: 9.3px;
  line-height: 1.55;
}

/* ---------- responsive ---------- */
@media (max-width: 620px) {
  .stage {
    display: block;
    min-height: 100dvh;
    padding: 0;
    background: var(--bg);
  }
  .phone {
    width: 100%;
    height: 100dvh;
    max-height: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .stage-caption { display: none; }
  .statusbar { display: none; }
  .statusbar + .app { height: 100%; }
  .topbar { padding-top: max(12px, env(safe-area-inset-top)); }
}

@media (max-height: 760px) and (min-width: 621px) {
  .stage { gap: 10px; padding: 12px 20px; }
  .stage-caption { display: none; }
  .phone { max-height: calc(100dvh - 24px); }
}

/* Deep-linked design-review states should be stable in screenshots. */
html.debug-view .sheet,
html.debug-view .overlay,
html.debug-view .modal-wrap,
html.debug-view .modal {
  transition: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
/* ---------- bottom navigation ---------- */
[hidden] { display: none !important; }

.bottom-nav {
  flex: none;
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 6px 42px calc(7px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(219, 227, 238, .94);
  background: rgba(255, 255, 255, .96);
  box-shadow: 0 -8px 24px rgba(27, 54, 94, .045);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.nav-item {
  position: relative;
  height: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 600;
  cursor: pointer;
  transition: color .16s ease, background .16s ease;
}
.nav-item:hover { color: var(--text-2); }
.nav-item.active { color: var(--accent); }
.nav-icon {
  width: 37px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  transition: background .16s ease, transform .16s ease;
}
.nav-item.active .nav-icon { background: var(--accent-soft); }
.nav-item:active .nav-icon { transform: scale(.94); }
.nav-label { line-height: 1; }
.nav-dot {
  position: absolute;
  top: 7px;
  right: calc(50% - 23px);
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid #fff;
  background: var(--muted);
}
.nav-dot.online { background: var(--green); }
.nav-dot.offline { background: #D29A39; }

/* ---------- my tv page / initial setup ---------- */
.device-view { padding-bottom: 2px; }
.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 2px 14px;
}
.page-kicker {
  display: block;
  color: var(--accent);
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .11em;
}
.page-title {
  margin: 4px 0 0;
  font-size: 23px;
  font-weight: 720;
  letter-spacing: -.02em;
  line-height: 1.2;
}
.page-sub {
  max-width: 278px;
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 9.8px;
  line-height: 1.55;
}
.page-head > .badge { margin-top: 18px; flex: none; }

.setup-hero {
  position: relative;
  overflow: hidden;
  padding: 14px;
  border-radius: 21px;
  border: 1px solid #D8E7FF;
  background: linear-gradient(145deg, #EFF6FF 0%, #F7FAFF 58%, #FFFFFF 100%);
  box-shadow: 0 6px 20px rgba(47, 125, 255, .06);
}
.setup-hero::after {
  content: "";
  position: absolute;
  right: -46px;
  top: -64px;
  width: 168px;
  height: 168px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(47, 125, 255, .11), transparent 68%);
  pointer-events: none;
}
.setup-topline {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 8.6px;
  font-weight: 600;
}
.setup-topline span:first-child { color: var(--text-2); }
.setup-route {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 15px 0 13px;
}
.route-node {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  color: var(--accent);
  background: #fff;
  border: 1px solid rgba(47, 125, 255, .18);
  box-shadow: 0 7px 16px rgba(47, 125, 255, .12);
}
.route-node.tv { color: var(--violet); border-color: rgba(115, 80, 242, .18); box-shadow: 0 7px 16px rgba(115, 80, 242, .1); }
.route-line {
  position: relative;
  width: 42px;
  height: 1px;
  background: linear-gradient(90deg, #C7DFFF, #D9D2FF);
}
.route-line i {
  position: absolute;
  top: -2px;
  left: 0;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  animation: routeDot 1.8s ease-in-out infinite;
}
.route-line + .route-line i { animation-delay: .4s; }
@keyframes routeDot {
  0% { left: 0; opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { left: calc(100% - 5px); opacity: 0; }
}
.route-badge {
  padding: 2px 5px;
  border-radius: 6px;
  border: 1px solid #D6E5FF;
  background: rgba(255, 255, 255, .8);
  color: var(--accent);
  font-size: 7.5px;
  font-weight: 750;
  letter-spacing: .07em;
}
.setup-hero-copy { position: relative; z-index: 1; margin-bottom: 12px; }
.setup-hero-copy strong { display: block; font-size: 11px; font-weight: 650; }
.setup-hero-copy p { margin: 4px 0 0; color: var(--text-2); font-size: 9.2px; line-height: 1.55; }
.setup-hero .btn { position: relative; z-index: 1; height: 42px; border-radius: 12px; font-size: 11px; }
.setup-usb-link { display: block; width: 100%; margin-top: 7px; text-align: center; font-size: 9px; }

.last-device-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 11px;
  padding: 10px 11px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(27, 54, 94, .03);
  transition: border-color .16s ease, box-shadow .16s ease;
}
.last-device-card:hover { border-color: #CFE0F7; box-shadow: var(--shadow-card); }
.last-device-icon {
  width: 33px;
  height: 33px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 11px;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid #D8E8FF;
}
.last-device-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.last-device-copy strong { font-size: 9.8px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.last-device-copy .mono { color: var(--muted); font-size: 8.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.last-device-cta { flex: none; color: var(--accent); font-size: 9px; font-weight: 650; }

.page-section { margin-top: 19px; }
.page-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 0 2px 8px;
}
.page-section-head h3 { margin: 0; font-size: 12.5px; font-weight: 680; letter-spacing: -.005em; }
.page-section-head span { color: var(--muted); font-size: 8.6px; }

.prep-list {
  overflow: hidden;
  border-radius: 17px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.prep-step { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; }
.prep-step + .prep-step { border-top: 1px solid #EDF2F8; }
.prep-num {
  width: 25px;
  height: 25px;
  flex: none;

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);

function wait(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function appLogo(app, extraClass = '') {
  return `<span class="app-logo ${extraClass}" style="--logo-color:${app.color};--logo-tint:${app.tint};--logo-border:${app.border}">${app.letter}</span>`;
}

function badge(text, tone = 'muted') {
  return `<span class="badge badge-${tone}">${text}</span>`;
}

function variantFor(app, id) {
  if (!app || !app.variants || !app.variants.length) return null;
  return app.variants.find((v) => v.id === id) || app.variants.find((v) => v.id === app.defaultVariant) || app.variants[0];
}

function installedPackage(app) {
  const v = variantFor(app, app.installedVariant);
  return v ? v.packageName : app.packageName;
}

function defaultHomeLabel() {
  if (state.defaultHome === 'stock') return STOCK_HOME;
  return APPS[state.defaultHome] ? APPS[state.defaultHome].name : '未知';
}

function promptFor(app) {
  const ip = state.connected ? state.tv.ip : '【电视IP】';
  return app.agentPrompt.replace(/【电视IP】/g, ip);
}

function isTool(app) {
  return app.category === 'tool';
}

function sourceOrder(app) {
  if (app.needsPc) return '官方页面（无 APK）';
  if (app.id === 'studyontv') {
    if (state.source === 'gitee') return 'Gitee 镜像 → GitHub 官方 → 蒲公英备用';
    return 'GitHub 官方 → Gitee 镜像 → 蒲公英备用';
  }
  const hasGitee = Boolean(app.giteeUrl);
  if (state.source === 'gitee') {
    return hasGitee ? 'Gitee → 官方 → GitHub' : '官方 → GitHub（无 Gitee 镜像）';
  }
  if (state.source === 'github') {
    return hasGitee ? 'GitHub → 官方 → Gitee' : 'GitHub → 官方';
  }
  return hasGitee ? '官方 → Gitee → GitHub' : '官方 → GitHub';
}

function featureChips(app, extra = '') {
  return app.features.map((text) => (
    `<span class="feature-chip ${extra}" style="--chip-color:${app.color};--chip-bg:${app.tint};--chip-border:${app.border}">${text}</span>`
  )).join('');
}

function appBadges(app) {
  let html = '';
  if (app.isNew) html += badge('新上架', 'orange');
  if (app.testBuild) html += badge('测试版', 'amber');
  if (state.defaultHome === app.id) html += badge('默认桌面', 'green');
  else if (app.installed) html += badge('已安装', 'green');
  if (app.needsPc) html += badge('需电脑', 'amber');
  return html;
}

function cardAction(app) {
  if (app.installed) return { action: 'open-app', label: '管理', cls: 'ghost' };
  if (app.needsPc) return { action: 'open-app', label: '安装指引', cls: 'amber' };
  if (!state.connected) return { action: 'open-connect', label: '先连接', cls: 'ghost' };
  return { action: 'open-app', label: '安装', cls: 'primary' };
}

function appCard(app) {
  const cta = cardAction(app);
  return `<article class="tool-card ${app.isNew ? 'is-new' : ''}">
    <button class="card-open" data-action="open-app" data-app="${app.id}" aria-label="查看 ${app.name}"></button>
    <div class="tool-top">
      ${appLogo(app)}
      <div class="tool-copy">
        <div class="tool-name-row">
          <h3>${app.name}</h3>
          ${appBadges(app)}
        </div>
        <p class="tool-tagline">${app.latin ? `${app.latin} · ` : ''}${app.tagline}</p>
      </div>
      <button class="store-btn ${cta.cls}" data-action="${cta.action}" ${cta.action === 'open-app' ? `data-app="${app.id}"` : ''}>${cta.label}</button>
    </div>
    <p class="tool-desc">${app.desc}</p>
    <div class="tool-features">${featureChips(app)}</div>
    ${app.cardNote ? `<div class="card-note ${app.cardNote.tone === 'info' ? 'info' : ''}">
      ${icon(app.cardNote.tone === 'info' ? 'info' : 'warning', 12)}
      <span>${app.cardNote.text}</span>
    </div>` : ''}
  </article>`;
}

function matchesSearch(app) {
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  const haystack = [
    app.name,
    app.latin || '',
    app.tagline,
    app.desc,
    app.packageName,
    ...app.features
  ].join(' ').toLowerCase();
  return haystack.includes(q);
}

/* ---------- main screen ---------- */
function renderSections() {
  const sections = GROUPS
    .filter((group) => state.filter === 'all' || state.filter === group.id)
    .map((group) => {
      const apps = ORDER
        .map((id) => APPS[id])
        .filter((app) => app.category === group.id && matchesSearch(app));
      return { group, apps };
    })
    .filter(({ apps }) => apps.length);

  if (!sections.length) {
    $('#appSections').innerHTML = `<div class="empty-state">
      <strong>没有找到相关工具</strong>
      换个关键词，或查看全部已收录工具。
      <br><button class="btn btn-ghost btn-sm" data-action="reset-filters">清除筛选</button>
    </div>`;
    return;
  }

  $('#appSections').innerHTML = sections.map(({ group, apps }) => {
    const all = ORDER.map((id) => APPS[id]).filter((app) => app.category === group.id);
    const installed = all.filter((app) => app.installed).length;
    return `<section class="store-section">
      <div class="section-head">
        <div class="section-copy">
          <h2>${group.title}</h2>
          <p>${group.desc}</p>
        </div>
        <span class="section-count">${installed} / ${all.length} 已安装</span>
      </div>
      <div class="tool-list">${apps.map(appCard).join('')}</div>
    </section>`;
  }).join('');
}

function syncFilterUI() {
  document.querySelectorAll('.filter-chip').forEach((chip) => {
    chip.classList.toggle('active', chip.dataset.filter === state.filter);
  });
  const clear = $('#searchClear');
  if (clear) clear.classList.toggle('show', Boolean(state.search));
}

function transportLabel(transport) {

function tvEndpoint(tv) {

}

function syncChrome() {
  const deviceTab = state.tab === 'device';
  const logo = $('#brandLogo');
  const title = $('#brandTitle');
  const sub = $('#brandSub');
  if (logo) logo.innerHTML = deviceTab ? icon('tv', 22) : icon('store', 22);

function switchTab(tab, scroll = true) {

  $('#deviceCard').innerHTML = state.connected

  if (countAll) countAll.textContent = ORDER.length;

/* ---------- sheet / modal / toast ---------- */
function showSheet() {
  clearTimeout(sheetCloseTimer);
  sheetOpen = true;
  $('#overlay').classList.add('show');
  $('#overlay').setAttribute('aria-hidden', 'false');
  $('#sheet').classList.add('open');
  $('#sheet').setAttribute('aria-hidden', 'false');
}

function closeSheet(force = false) {
  if (busy && !force) return;
  sheetOpen = false;
  $('#overlay').classList.remove('show');
  $('#overlay').setAttribute('aria-hidden', 'true');
  $('#sheet').classList.remove('open');
  $('#sheet').setAttribute('aria-hidden', 'true');
  clearTimeout(sheetCloseTimer);
  sheetCloseTimer = setTimeout(() => {
    if (!sheetOpen) {
      $('#sheetBody').innerHTML = '';
      sheetContext = null;
    }
  }, 300);
}

function setSheet(html) {
  $('#sheetBody').innerHTML = html;
  showSheet();
  $('#sheetBody').scrollTop = 0;
}

function openModal(html) {
  $('#modal').innerHTML = html;
  $('#modalWrap').classList.add('show');
  $('#modalWrap').setAttribute('aria-hidden', 'false');
}

function closeModal() {
  $('#modalWrap').classList.remove('show');
  $('#modalWrap').setAttribute('aria-hidden', 'true');
  clearTimeout(modalCloseTimer);
  modalCloseTimer = setTimeout(() => {
    if (!$('#modalWrap').classList.contains('show')) $('#modal').innerHTML = '';
  }, 220);
}

function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

async function copyText(text, message = '已复制') {
  try {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
    } else {
      throw new Error('clipboard unavailable');
    }
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) { /* noop */ }
    document.body.removeChild(ta);
  }
  toast(message);
}/* ---------- detail ---------- */
function closeBtn() {
  return `<button class="sheet-close" data-action="close-sheet" aria-label="关闭">${icon('close', 17)}</button>`;
}

function openDetail(appId) {
  const app = APPS[appId];
  if (!app) return;
  sheetContext = {
    type: 'detail',
    appId,
    variantId: app.installed ? (app.installedVariant || app.defaultVariant) : app.defaultVariant
  };
  renderDetail();
  showSheet();
  $('#sheetBody').scrollTop = 0;
}

function statusBadges(app) {
  let html = app.installed ? badge('已安装', 'green') : badge('未安装', 'muted');
  if (state.defaultHome === app.id) html += badge('默认桌面', 'green');
  if (app.isNew) html += badge('新上架', 'orange');
  if (app.testBuild) html += badge('测试版', 'amber');
  if (app.needsPc) html += badge('需电脑', 'amber');
  if (app.category === 'tool') html += badge('工具应用', 'blue');
  return html;
}

function renderDetail() {
  if (!sheetContext || sheetContext.type !== 'detail') return;
  const app = APPS[sheetContext.appId];
  if (!app) return;
  const variant = variantFor(app, sheetContext.variantId);
  let body;
  if (app.needsPc) body = app.installed ? installedBody(app, variant) : cleanBody(app);
  else if (app.installed) body = app.category === 'tool' ? installedToolBody(app, variant) : installedBody(app, variant);
  else body = app.category === 'tool' ? toolInstallBody(app, variant) : installBody(app, variant);

  $('#sheetBody').innerHTML = `
    <div class="detail-head">
      ${appLogo(app, 'detail-logo')}
      <div class="detail-head-copy">
        <h2 class="detail-name">${app.name}</h2>
        ${app.latin ? `<div class="detail-latin">${app.latin}</div>` : ''}
        <p class="detail-tagline">${app.tagline}</p>
        <div class="detail-status">${statusBadges(app)}</div>
      </div>
      ${closeBtn()}
    </div>
    <div class="detail-features">${featureChips(app)}</div>
    ${body}
  `;
}

function installedBody(app, variant) {
  const pkg = installedPackage(app);
  const isDefault = state.defaultHome === app.id;
  const versionLabel = variant ? variant.label : '官方构建';

  let notice = '';
  if (app.needsPc) {
    notice = `<div class="notice">
      ${icon('warning', 15)}
      <div><strong>卸载不会恢复被停用的系统应用</strong><p>请先在电脑运行官方 restore.sh 恢复清理项与默认 HOME，再回来卸载 launcher。</p></div>
    </div>`;
  } else if (app.id === 'planyourtv') {
    notice = `<div class="notice">
      ${icon('warning', 15)}
      <div><strong>数据会一起删除</strong><p>家长规则、题库、壁纸、照片和一次性恢复码都保存在应用数据里，卸载后不可恢复。</p></div>
    </div>`;
  } else if (app.id === 'aerial') {
    notice = `<div class="notice">
      ${icon('warning', 15)}
      <div><strong>包名共用提示</strong><p>app.orchard.tv 也可能属于旧版 HaloTV。卸载前请在电视上核对应用名和版本。</p></div>
    </div>`;
  } else if (app.id === 'halotv') {
    notice = `<div class="notice">
      ${icon('info', 15)}

  } else if (app.id === 'quiettv') {
    notice = `<div class="notice">

    </div>`;
  }

  return `
    <div class="action-row">
      ${state.connected
        ? `<button class="btn btn-primary" data-action="launch-app" data-app="${app.id}">${icon('play', 14)}在电视上打开</button>`
        : `<button class="btn btn-primary" data-action="open-connect">${icon('wifi', 14)}先连接电视</button>`}

        ? `<button class="btn btn-ghost" disabled>已是默认桌面</button>`
        : `<button class="btn btn-ghost" data-action="make-default" data-app="${app.id}">设为默认桌面</button>`}
    </div>

    <div class="info-list">
      <div class="info-row"><span class="info-key">当前版本</span><span class="info-val">${app.installedVersion}</span></div>
      <div class="info-row"><span class="info-key">包名</span><span class="info-val mono">${pkg}</span></div>
      <div class="info-row"><span class="info-key">版本档</span><span class="info-val">${versionLabel}</span></div>
      <div class="info-row"><span class="info-key">最低系统</span><span class="info-val">${app.minAndroid}</span></div>
      <div class="info-row"><span class="info-key">默认桌面</span><span class="info-val">${isDefault ? '是' : `否 · ${defaultHomeLabel()}`}</span></div>

  `;

  const versionLabel = variant ? variant.label : '官方构建';

function stepsHTML(prefix, steps) {
  return `<div class="steps">${steps.map((step, i) => `
    <div class="step" id="${prefix}step-${i}">
      <div class="step-rail">
        <div class="step-dot">${i + 1}</div>
        <div class="step-line"></div>
      </div>
      <div class="step-copy">
        <div class="step-title">${step.title}</div>
        <div class="step-detail">${step.detail}</div>
        ${step.progress ? `<div class="step-progress" id="${prefix}prog-${i}">
          <div class="progress-track"><div class="progress-bar" id="${prefix}bar-${i}"></div></div>
          <div class="progress-meta"><span id="${prefix}left-${i}">准备下载</span><span id="${prefix}pct-${i}">0%</span></div>
        </div>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

function setStepState(prefix, index, status, detail) {
  const step = document.getElementById(`${prefix}step-${index}`);
  if (!step) return;
  step.className = `step ${status}`;
  const dot = step.querySelector('.step-dot');
  if (dot) {
    if (status === 'done') dot.innerHTML = icon('check', 12);
    else if (status === 'active') dot.innerHTML = '<span class="spinner"></span>';
    else if (status === 'skipped') dot.textContent = '–';
    else if (status === 'fail') dot.textContent = '!';
    else dot.textContent = String(index + 1);
  }
  if (typeof detail === 'string') {
    const detailEl = step.querySelector('.step-detail');
    if (detailEl) detailEl.textContent = detail;
  }
  const prog = step.querySelector('.step-progress');
  if (prog) prog.style.display = status === 'active' ? 'block' : 'none';
}

function startInstall(appId) {
  if (busy) return;
  const app = APPS[appId];
  if (!app || !app.installable) return;
  if (!state.connected) {
    toast('请先连接电视');
    openConnect('wireless');
    return;
  }
  const ctxVariant = sheetContext && sheetContext.type === 'detail' && sheetContext.appId === appId
    ? sheetContext.variantId
    : app.defaultVariant;
  const variant = variantFor(app, ctxVariant);
  if (!variant) return;

  const seq = ++installSeq;
  const opts = {
    setHome: app.category !== 'tool' && state.setHomeOnInstall,
    guide: app.category === 'tool' && state.openPermissionGuide
  };
  sheetContext = { type: 'install', appId, variantId: variant.id, ...opts };
  busy = true;
  $('#sheetBody').innerHTML = installProgressHTML(app, variant, opts);
  showSheet();
  $('#sheetBody').scrollTop = 0;
  setStepState('i', 0, 'active', '正在读取 Android 版本与剩余空间');
  runInstall(seq, app, variant, opts).catch(() => {
    if (seq === installSeq) {
      busy = false;
      toast('安装流程中断，请重试');
    }
  });
}

function animateDownload(prefix, index, duration, sizeText, seq) {
  return new Promise((resolve) => {
    const bar = document.getElementById(`${prefix}bar-${index}`);
    const left = document.getElementById(`${prefix}left-${index}`);
    const pct = document.getElementById(`${prefix}pct-${index}`);
    const parsed = parseFloat(String(sizeText).replace(/[^\d.]/g, ''));
    const size = Number.isFinite(parsed) ? parsed : 5;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const actual = reduce ? 180 : duration;
    const started = performance.now();

    function tick(now) {
      if (seq !== installSeq) {
        resolve(false);
        return;
      }
      const t = Math.min(1, (now - started) / actual);
      const eased = 1 - Math.pow(1 - t, 3);
      const percent = Math.round(eased * 100);
      if (bar) bar.style.width = `${percent}%`;
      if (pct) pct.textContent = `${percent}%`;
      if (left) {
        const speed = (1.1 + Math.sin(percent / 18) * 0.25).toFixed(1);
        left.textContent = `${(size * eased).toFixed(1)} / ${size.toFixed(1)} MB · ${speed} MB/s`;
      }
      if (t < 1) requestAnimationFrame(tick);
      else resolve(true);
    }
    requestAnimationFrame(tick);
  });
}

async function runInstall(seq, app, variant, opts) {
  const alive = () => seq === installSeq;
  const toolFlow = app.category === 'tool';

  await wait(380);
  if (!alive()) return;
  setStepState('i', 0, 'done', `Android ${state.tv.android} · 空间 2.4 GB · ADB 已授权`);

  setStepState('i', 1, 'active', '正在读取官方最新版本…');
  await wait(280);
  if (!alive()) return;
  setStepState('i', 1, 'active', '正在下载安装包…');
  const downloaded = await animateDownload('i', 1, 1100, variant.size, seq);
  if (!downloaded) return;
  setStepState('i', 1, 'done', `已下载 · ${variant.size.replace('约 ', '')} · 校验值已获取`);

  setStepState('i', 2, 'active', '正在比对官方 SHA-256…');
  await wait(520);
  if (!alive()) return;
  setStepState('i', 2, 'done', '校验通过 · 文件完整');

  setStepState('i', 3, 'active', `正在安装 ${variant.packageName}`);
  await wait(850);
  if (!alive()) return;
  setStepState('i', 3, 'done', 'APK 安装成功');

  if (toolFlow) {
    let next = 4;
    if (opts.guide) {
      setStepState('i', next, 'active', '正在打开权限引导…');
      await wait(620);
      if (!alive()) return;
      setStepState('i', next, 'done', '权限引导已打开 · 可在电视上按需开启');
      next += 1;
    }
    setStepState('i', next, 'active', '正在启动并验收…');
    await wait(720);
    if (!alive()) return;
    setStepState('i', next, 'done', `前台应用正常 · ${defaultHomeLabel()} 保持不变`);
  } else {
    setStepState('i', 4, 'active', '正在授予通知监听 / 悬浮窗 / 使用统计');
    await wait(620);
    if (!alive()) return;
    setStepState('i', 4, 'done', '权限已授予');

    if (opts.setHome) {
      setStepState('i', 5, 'active', '正在切换 HOME role');
      await wait(620);
      if (!alive()) return;
      state.defaultHome = app.id;
      setStepState('i', 5, 'done', `默认桌面 → ${app.name}`);
    } else {
      setStepState('i', 5, 'skipped', '按设置保留当前桌面');
    }

    setStepState('i', 6, 'active', '正在启动并验收…');
    await wait(720);
    if (!alive()) return;
    setStepState('i', 6, 'done', '前台应用与 Home 键正常');
  }

  app.installed = true;
  app.installedVersion = app.latestVersion;
  app.installedVariant = variant.id;
  busy = false;
  renderMain();
  sheetContext = { type: 'install-success', appId: app.id, variantId: variant.id, ...opts };
  renderInstallSuccess();
}

function openUninstallModal(appId) {
  const app = APPS[appId];
  if (!app || !app.installed) return;
  const pkg = installedPackage(app);
  const toolFlow = app.category === 'tool';
  const isDefault = !toolFlow && state.defaultHome === app.id;
  const warnings = [];

  if (toolFlow) {
    warnings.push(`默认桌面保持为 ${defaultHomeLabel()}；卸载工具不会更改 HOME。`);
    warnings.push('题库、学习记录、观看时长和家长规则会被删除，无法恢复。');
    warnings.push('如果曾在电视上开启“设备管理员”，请先取消，否则系统会拒绝卸载。');
    warnings.push('家长面板 8099 端口将随应用一起停止，本地数据不保留。');
  } else {
    if (isDefault) warnings.push('卸载前会先把默认桌面切回系统桌面，避免主页空白。');
    warnings.push('应用数据、排序、壁纸和设置会被删除，无法恢复。');
    if (app.id === 'aerial') warnings.push('app.orchard.tv 也可能属于旧版 HaloTV，请确认电视上显示的应用名是 Aerial。');
    if (app.id === 'planyourtv') warnings.push('家长规则、题库、照片和一次性恢复码会一起删除。');
    if (app.id === 'halotv') warnings.push('只会卸载 app.halotv.launcher（或 .lite），不会动 Aerial 的 app.orchard.tv。');
    if (app.id === 'quiettv') warnings.push('home.quiet.tv 是用户安装包；厂商预装的 com.coocaa.quiettv 不会被处理。');
    if (app.needsPc) warnings.push('只卸载 launcher 不会恢复被停用的广告服务和系统应用，必须先运行官方 restore.sh。');
  }

  const warningHtml = warnings.map((text) => `<div class="warn-item">${icon('warning', 13)}<span>${text}</span></div>`).join('');
  const cleanCheck = app.needsPc
    ? `<label class="check-row">
        <input type="checkbox" id="cleanRestoreCheck" data-action="toggle-clean-check">
        <span>我已在电脑执行官方 restore.sh，恢复被停用的系统应用和原桌面</span>
      </label>`
    : '';

  openModal(`
    <h3 class="modal-title">卸载 ${app.name}？</h3>
    <p class="modal-sub">检测到的应用：${app.name} · ${app.installedVersion || '已安装'}<br>包名：${pkg}</p>
    <div class="warn-list">${warningHtml}</div>
    ${cleanCheck}
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="close-modal">取消</button>
      <button class="btn btn-danger" id="confirmUninstall" data-action="confirm-uninstall" data-app="${app.id}" ${app.needsPc ? 'disabled' : ''}>确认卸载</button>
    </div>
  `);
}

function startUninstall(app) {
  if (busy) return;
  const wasDefault = app.category !== 'tool' && state.defaultHome === app.id;
  const seq = ++uninstallSeq;
  closeModal();
  sheetContext = { type: 'uninstall', appId: app.id };
  busy = true;
  $('#sheetBody').innerHTML = uninstallProgressHTML(app, wasDefault);
  showSheet();
  $('#sheetBody').scrollTop = 0;
  setStepState('u', 0, 'active', app.category === 'tool' ? '正在停止计时与悬浮层…' : '正在停止守护与通知监听…');
  runUninstall(seq, app, wasDefault).catch(() => {
    if (seq === uninstallSeq) {
      busy = false;
      toast('卸载流程中断，请检查电视连接');
    }
  });
}

async function runUninstall(seq, app, wasDefault) {
  const pkg = installedPackage(app);
  const toolFlow = app.category === 'tool';

  await wait(480);
  setStepState('u', 0, 'done', toolFlow ? '前台服务已停止 · 悬浮层已关闭' : (app.needsPc ? '已确认官方恢复 · 守护已停止' : '无障碍 / 通知监听已停止'));

  if (toolFlow) {
    setStepState('u', 1, 'active', '正在检查设备管理员…');
    await wait(460);
    setStepState('u', 1, 'done', '未检测到设备管理员限制');
  } else if (wasDefault) {
    setStepState('u', 1, 'active', '正在切回系统桌面…');
    await wait(560);
    state.defaultHome = 'stock';
    renderMain();
    setStepState('u', 1, 'done', `默认桌面 → ${STOCK_HOME}`);
  } else {
    setStepState('u', 1, 'skipped', '当前不是默认桌面，无需切换');
  }

  setStepState('u', 2, 'active', `正在卸载 ${pkg}…`);
  await wait(760);
  app.installed = false;
  app.installedVersion = '';
  app.installedVariant = '';
  setStepState('u', 2, 'done', 'APK 已卸载 · 应用数据已删除');

  setStepState('u', 3, 'active', toolFlow ? '正在确认默认桌面与包状态…' : '正在读回默认桌面与包状态…');
  await wait(520);
  setStepState('u', 3, 'done', toolFlow ? `默认桌面仍为 ${defaultHomeLabel()} · 包已移除` : `主页正常 · ${defaultHomeLabel()}`);

  busy = false;
  renderMain();
  sheetContext = { type: 'uninstall-success', appId: app.id, wasDefault, pkg };
  renderUninstallSuccess(app, wasDefault, pkg);
}
